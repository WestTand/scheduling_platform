spring.datasource.url=jdbc:h2:mem:scheduling-platform-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.jwt.secret=test-secret-key-with-at-least-32-characters
app.auth.default-employee-password=configured-default
app.auth.refresh-cookie-secure=false
