spring.application.name=scheduling

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scheduling_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scheduling_platform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scheduling_platform_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.ai-service-url=${AI_SERVICE_URL:http://localhost:8001}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
app.auth.refresh-token-ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:604800}
app.auth.refresh-cookie-name=${REFRESH_COOKIE_NAME:refresh_token}
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
