spring.application.name=scheduling

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scheduling_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scheduling_platform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scheduling_platform_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.ai-service-url=${AI_SERVICE_URL:http://localhost:8001}
